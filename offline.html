<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1324">
<title>333 Network · Offline</title>
<style>
:root{--bg:#0b1324;--panel:#151f36;--text:#f6f3ed;--muted:#b6c1cd;--gold:#e6d5ad}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,rgba(230,213,173,.12),transparent 30rem),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{width:min(100%,620px);padding:33px;border:1px solid rgba(255,255,255,.14);border-radius:21px;background:var(--panel)}
h1{margin:0;font-family:Georgia,serif;font-weight:500;font-size:clamp(2.5rem,8vw,5rem)}p{color:var(--muted);line-height:1.7}
button,a{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border:1px solid rgba(255,255,255,.25);border-radius:7px;color:var(--text);background:transparent;text-decoration:none;font-weight:600}
strong{color:var(--gold)}
</style>
</head>
<body>
<main>
<p><strong>333 NETWORK</strong></p>
<h1>You are offline.</h1>
<p>The installed interface and previously cached pages remain available. New cross-device activity will require a network connection and the future synchronized 333 backend.</p>
<button onclick="location.reload()">Try Again</button>
<a href="./">Return Home</a>
</main>
</body>
</html>
